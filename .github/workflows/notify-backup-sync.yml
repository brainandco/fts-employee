# After main is updated, bump this app's submodule pointer in the backup monorepo.
name: Notify backup sync

on:
  push:
    branches: [main]

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger BrainAndCompany/fasttechsolutions sync
        env:
          GH_TOKEN: ${{ secrets.BACKUP_DISPATCH_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::warning::BACKUP_DISPATCH_TOKEN is not set. Add a PAT with repo access to BrainAndCompany/fasttechsolutions."
            exit 0
          fi
          curl -fsS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/BrainAndCompany/fasttechsolutions/dispatches \
            -d '{"event_type":"sync-fts-employee","client_payload":{"source":"brainandco/fts-employee","sha":"'"$GITHUB_SHA"'"}}'
          echo "Dispatched sync-fts-employee"
